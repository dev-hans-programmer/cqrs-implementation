[project]
name = "fastapi-cqrs-saga-example"
version = "0.1.0"
description = "A production-shaped CQRS and Saga learning project"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5,<10.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.50b0,<1.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<6.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "asyncpg-stubs>=0.30,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

